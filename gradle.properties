# gradle.properties – Project-wide Gradle settings for PetCare.
# These settings affect build performance and AndroidX configuration.

# ── AndroidX ──────────────────────────────────────────────────────────
# Use AndroidX instead of the older Support Library (required for Material 3)
android.useAndroidX=true

# ── Build performance ──────────────────────────────────────────────────
# Disable Gradle Daemon to prevent file locking on Windows
org.gradle.daemon=false
# Allocate sufficient heap for KSP annotation processing
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Enable parallel project execution (safe for single-module projects)
org.gradle.parallel=true
# Disable configuration caching and VFS watching on Windows OneDrive to prevent file-locking clashes
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false

# ── Kotlin ────────────────────────────────────────────────────────────
# Enables Kotlin incremental compilation
kotlin.incremental=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
