# =====================================================================
# libs.versions.toml – PetCare version catalog
# All library versions are pinned here so that build files stay clean.
# Update versions here only; do not hard-code versions in build files.
# =====================================================================

[versions]
# Build tooling
agp                     = "8.7.3"          # Android Gradle Plugin
kotlin                  = "2.1.0"           # Kotlin compiler
ksp                     = "2.1.0-1.0.29"   # Kotlin Symbol Processing (matches Kotlin version)

# AndroidX core
coreKtx                 = "1.15.0"
appcompat               = "1.7.0"
activityKtx             = "1.9.3"
fragmentKtx             = "1.8.5"
lifecycleViewmodel      = "2.8.7"
lifecycleRuntime        = "2.8.7"

# UI
material                = "1.12.0"          # Material Components 3
constraintlayout        = "2.2.0"
recyclerview            = "1.3.2"

# Navigation
navigationFragment      = "2.8.5"
navigationUi            = "2.8.5"

# Room
room                    = "2.6.1"

# WorkManager
workmanager             = "2.10.0"

# Coroutines
coroutines              = "1.9.0"

# Security (for password hashing via MessageDigest – no extra lib needed)
# DataStore / SharedPreferences – uses framework, no extra version needed

# Testing
junit                   = "4.13.2"
androidxTestExt         = "1.2.1"
espressoCore            = "3.6.1"

[libraries]
# ── Core ──────────────────────────────────────────────────────────────
androidx-core-ktx               = { group = "androidx.core",            name = "core-ktx",                  version.ref = "coreKtx" }
androidx-appcompat               = { group = "androidx.appcompat",       name = "appcompat",                 version.ref = "appcompat" }
androidx-activity-ktx            = { group = "androidx.activity",        name = "activity-ktx",              version.ref = "activityKtx" }
androidx-fragment-ktx            = { group = "androidx.fragment",        name = "fragment-ktx",              version.ref = "fragmentKtx" }

# ── Lifecycle ─────────────────────────────────────────────────────────
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle",       name = "lifecycle-viewmodel-ktx",   version.ref = "lifecycleViewmodel" }
androidx-lifecycle-runtime-ktx   = { group = "androidx.lifecycle",       name = "lifecycle-runtime-ktx",     version.ref = "lifecycleRuntime" }
androidx-lifecycle-livedata-ktx  = { group = "androidx.lifecycle",       name = "lifecycle-livedata-ktx",    version.ref = "lifecycleViewmodel" }

# ── UI ────────────────────────────────────────────────────────────────
material                         = { group = "com.google.android.material", name = "material",               version.ref = "material" }
androidx-constraintlayout        = { group = "androidx.constraintlayout", name = "constraintlayout",         version.ref = "constraintlayout" }
androidx-recyclerview            = { group = "androidx.recyclerview",     name = "recyclerview",             version.ref = "recyclerview" }

# ── Navigation ────────────────────────────────────────────────────────
androidx-navigation-fragment-ktx = { group = "androidx.navigation",      name = "navigation-fragment-ktx",   version.ref = "navigationFragment" }
androidx-navigation-ui-ktx       = { group = "androidx.navigation",      name = "navigation-ui-ktx",         version.ref = "navigationUi" }

# ── Room ──────────────────────────────────────────────────────────────
androidx-room-runtime            = { group = "androidx.room",            name = "room-runtime",              version.ref = "room" }
androidx-room-ktx                = { group = "androidx.room",            name = "room-ktx",                  version.ref = "room" }
androidx-room-compiler           = { group = "androidx.room",            name = "room-compiler",             version.ref = "room" }   # KSP processor

# ── WorkManager ───────────────────────────────────────────────────────
androidx-work-runtime-ktx        = { group = "androidx.work",            name = "work-runtime-ktx",          version.ref = "workmanager" }

# ── Coroutines ────────────────────────────────────────────────────────
kotlinx-coroutines-android       = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ── Testing ───────────────────────────────────────────────────────────
junit                            = { group = "junit",                    name = "junit",                     version.ref = "junit" }
androidx-test-ext-junit          = { group = "androidx.test.ext",        name = "junit",                     version.ref = "androidxTestExt" }
androidx-espresso-core           = { group = "androidx.test.espresso",   name = "espresso-core",             version.ref = "espressoCore" }
androidx-room-testing            = { group = "androidx.room",            name = "room-testing",              version.ref = "room" }
kotlinx-coroutines-test          = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-test",   version.ref = "coroutines" }

[plugins]
# Android Gradle Plugin
android-application  = { id = "com.android.application",          version.ref = "agp" }
# Kotlin Android plugin
kotlin-android       = { id = "org.jetbrains.kotlin.android",     version.ref = "kotlin" }
# Kotlin Symbol Processing
ksp                  = { id = "com.google.devtools.ksp",           version.ref = "ksp" }
# Safe-args for Navigation
androidx-navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigationFragment" }
